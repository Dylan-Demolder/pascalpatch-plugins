name: Community plugins
# Checks and builds every plugin under community/ with the PascalPatch SDK, the way the
# maintainer will before signing it. Pull requests from forks run with a read-only token and no
# secrets; nothing here signs or publishes anything.
on:
  pull_request:
    paths: ["community/**", ".github/workflows/community.yml"]
  push:
    branches: [main]
    paths: ["community/**", ".github/workflows/community.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Dylan-Demolder/PascalPatch
          path: pascalpatch-sdk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check and build
        shell: pwsh
        run: |
          $plugins = @(Get-ChildItem community -Directory | ForEach-Object { $_.FullName })
          if ($plugins.Count -eq 0) { "No community plugins yet."; exit 0 }
          python pascalpatch-sdk/tooling/check_plugin.py @plugins --community --build --out dist
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-packages
          path: dist/*.zip
          if-no-files-found: ignore
